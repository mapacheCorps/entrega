<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Torpedos universitarios{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='estilos.css') }}">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="{{ url_for('inicio') }}">Torpedos universitarios</a>
    <form class="selector-rol" method="post" action="{{ url_for('cambiar_rol') }}">
      <label for="rol">Perfil de demostración</label>
      <select id="rol" name="rol" onchange="this.form.submit()">
        {% for rol in roles_demo %}
          <option value="{{ rol }}" {% if rol == rol_actual %}selected{% endif %}>{{ rol }}</option>
        {% endfor %}
      </select>
      <noscript><button type="submit">Cambiar</button></noscript>
    </form>
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    <p>Aplicación de demostración del curso CIN 324. No usa autenticación real.</p>
  </footer>
</body>
</html>
